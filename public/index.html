<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart AI Resume Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
      #resume-preview { box-shadow: none !important; border: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [form, setForm] = React.useState({
        name: 'Rajath',
        role: 'Web Development Intern',
        email: 'rajathrajath65@gmail.com',
        phone: '+91 63632 51925',
        education: 'B.E. in Computer Science & Engineering - MITE (USN: 4MT24CS154)',
        summary: 'Web Development Intern building responsive, user-centric web applications and RESTful services.',
        skills: 'HTML5, CSS3, JavaScript, React.js, Node.js, Tailwind CSS, Git',
        experience: 'Web Development Intern at Elevate Labs — Built a SaaS landing page with automated email verification and an AI-assisted smart resume builder.'
      });
      const [apiKey, setApiKey] = React.useState('');
      const [loading, setLoading] = React.useState(false);
      const [status, setStatus] = React.useState('');

      const handleChange = (e) => {
        setForm({ ...form, [e.target.name]: e.target.value });
      };

      const handleAiImprove = async () => {
        setLoading(true);
        setStatus('✨ Generating AI improvements...');
        try {
          const res = await fetch('/api/ai-suggest', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...form, apiKey })
          });
          const data = await res.json();
          setForm(prev => ({
            ...prev,
            summary: data.summary || prev.summary,
            skills: data.skills || prev.skills,
            experience: data.experience || prev.experience
          }));
          setStatus('✅ AI Suggestions applied to your resume!');
        } catch (err) {
          setStatus('❌ Could not fetch suggestions.');
        }
        setLoading(false);
      };

      const handleSave = async () => {
        const res = await fetch('/api/save-resume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(form)
        });
        const data = await res.json();
        setStatus('💾 ' + data.message);
      };

      return (
        <div className="max-w-7xl mx-auto p-6">
          {/* Header */}
          <header className="no-print bg-indigo-700 text-white p-5 rounded-xl shadow mb-6 flex flex-wrap justify-between items-center gap-4">
            <div>
              <h1 className="text-2xl font-bold">🚀 Smart Resume Builder with AI</h1>
              <p className="text-indigo-200 text-sm">Edit on the left, click AI Improve, and Export to PDF</p>
            </div>
            <div className="flex gap-3">
              <button onClick={handleAiImprove} disabled={loading}
                className="bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold px-4 py-2 rounded-lg shadow transition">
                {loading ? 'Thinking...' : '✨ AI Improve Resume'}
              </button>
              <button onClick={handleSave}
                className="bg-indigo-500 hover:bg-indigo-400 text-white font-semibold px-4 py-2 rounded-lg transition">
                💾 Save
              </button>
              <button onClick={() => window.print()}
                className="bg-emerald-500 hover:bg-emerald-400 text-white font-bold px-4 py-2 rounded-lg shadow transition">
                📄 Export PDF
              </button>
            </div>
          </header>

          {status && (
            <div className="no-print bg-indigo-50 border border-indigo-200 text-indigo-800 px-4 py-2.5 rounded-lg mb-6 text-sm font-medium">
              {status}
            </div>
          )}

          <div className="grid md:grid-cols-2 gap-8">
            {/* Left Form */}
            <div className="no-print bg-white p-6 rounded-xl shadow space-y-4">
              <h2 className="text-lg font-bold text-slate-800 border-b pb-2">Resume Details</h2>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-600">Full Name</label>
                  <input name="name" value={form.name} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Target Job Title</label>
                  <input name="role" value={form.role} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs font-semibold text-slate-600">Email</label>
                  <input name="email" value={form.email} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
                </div>
                <div>
                  <label className="text-xs font-semibold text-slate-600">Phone</label>
                  <input name="phone" value={form.phone} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-600">Education</label>
                <input name="education" value={form.education} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-600">Professional Summary</label>
                <textarea name="summary" rows="3" value={form.summary} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-600">Technical Skills (comma separated)</label>
                <input name="skills" value={form.skills} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
              </div>

              <div>
                <label className="text-xs font-semibold text-slate-600">Projects / Experience</label>
                <textarea name="experience" rows="4" value={form.experience} onChange={handleChange} className="w-full border p-2 rounded mt-1 text-sm" />
              </div>

              <div className="pt-2 border-t">
                <label className="text-xs font-semibold text-slate-500">Optional: Free Gemini API Key (Works without it too!)</label>
                <input type="password" placeholder="Leave empty for built-in AI enhancer..." value={apiKey} onChange={e => setApiKey(e.target.value)}
                  className="w-full border p-2 rounded mt-1 text-xs bg-slate-50" />
              </div>
            </div>

            {/* Right Live Resume Preview */}
            <div id="resume-preview" className="bg-white p-8 rounded-xl shadow-lg border border-slate-200 text-slate-800">
              <div className="border-b-2 border-slate-800 pb-4 mb-4">
                <h1 className="text-3xl font-extrabold uppercase tracking-wide text-slate-900">{form.name}</h1>
                <p className="text-indigo-600 font-semibold text-lg">{form.role}</p>
                <p className="text-xs text-slate-500 mt-1">{form.email} | {form.phone}</p>
              </div>

              <div className="mb-5">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b pb-1 mb-2">Professional Summary</h3>
                <p className="text-sm leading-relaxed text-slate-700">{form.summary}</p>
              </div>

              <div className="mb-5">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b pb-1 mb-2">Education</h3>
                <p className="text-sm font-medium text-slate-800">{form.education}</p>
              </div>

              <div className="mb-5">
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b pb-1 mb-2">Technical Skills</h3>
                <div className="flex flex-wrap gap-1.5 mt-2">
                  {form.skills.split(',').map((skill, idx) => (
                    <span key={idx} className="bg-slate-100 border border-slate-300 px-2.5 py-1 rounded text-xs font-medium">
                      {skill.trim()}
                    </span>
                  ))}
                </div>
              </div>

              <div>
                <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-700 border-b pb-1 mb-2">Projects & Experience</h3>
                <pre className="text-sm leading-relaxed text-slate-700 whitespace-pre-wrap font-sans">{form.experience}</pre>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
